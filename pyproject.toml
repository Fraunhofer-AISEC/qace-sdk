[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qace"
version = "1.0.0"
description = "Quantum-Assisted Cryptanalytic Exploration SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party_licenses/*"]
authors = [{ name = "Fraunhofer AISEC" }]
dependencies = [
    "beartype>=0.22,<0.23",
    "qiskit>=2.5,<3",
    "qiskit-aer>=0.17,<0.18",
    "qiskit-ibm-runtime>=0.47,<0.48",
    "numba>=0.61,<0.62",
    "bitarray>=3.6,<4",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pre-commit>=4.0.0",
    "black>=26.0.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-autorefs>=1.4,<2",
    "mkdocs-glightbox>=0.5,<0.6",
    "mkdocs-include-markdown-plugin>=7.3,<8",
    "mkdocs-mermaid2-plugin>=1.2,<2",
    "mkdocstrings>=1,<2",
    "mkdocstrings-python>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qace"]

# Ensure license/notice files are shipped inside the wheel
[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "qace/NOTICE"
"third_party_licenses" = "qace/third_party_licenses"

# Define what goes into the source distribution (sdist)
[tool.hatch.build.targets.sdist]
include = [
    "src/qace",
    "LICENSE",
    "NOTICE",
    "third_party_licenses",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"